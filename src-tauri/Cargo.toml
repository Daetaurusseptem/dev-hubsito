[package]
name = "devhubsito"
version = "0.1.1"
description = "DevHubsito — local project launcher by Daetaurus Jaime"
authors = ["Daetaurus Jaime"]
edition = "2021"

[lib]
name = "devhubsito_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
